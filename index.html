<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Приложение с Supabase</title>
    <!-- Подключаем официальную библиотеку Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; }
        .admin-panel { background: #f4f4f4; padding: 15px; margin-top: 20px; border-radius: 8px; }
        input, button { padding: 8px; margin: 5px 0; }
        .code-item { background: #fff; padding: 10px; margin: 5px 0; border: 1px solid #ddd; display: flex; justify-content: space-between; align-items: center; }
    </style>
</head>
<body>

    <h1>Список кодов</h1>
    <div id="codes-container">Загрузка данных из базы...</div>

    <!-- Панель администратора -->
    <div class="admin-panel">
        <h3>Панель администратора</h3>
        <input type="password" id="admin-pass" placeholder="Пароль администратора">
        <button onclick="checkAdmin()">Войти / Добавить</button>
        
        <div id="admin-controls" style="display:none; margin-top: 10px;">
            <input type="text" id="new-code" placeholder="Введите новый код">
            <button onclick="addCodeToDatabase()">Сохранить в базу</button>
        </div>
    </div>

    <script>
        // --- SUPABASE CONFIGURATION ---
        // Вставьте сюда ваши данные из панели Supabase (Settings -> API)
        const SUPABASE_URL = 'sb_publishable_eCeGKzNOkXAlKJUwWf0ZYw_5SOjT1nE'; 
        const SUPABASE_ANON_KEY = 'sb_secret_JfFu6RliRVaf0ijTn_OVww_a2PWeWE-';

        // Инициализация клиента Supabase
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Пароль администратора (можно изменить здесь)
        const ADMIN_PASSWORD = 'admin'; 

        // Загрузка кодов при открытии страницы
        window.addEventListener('DOMContentLoaded', loadCodesFromDatabase);

        async function loadCodesFromDatabase() {
            const container = document.getElementById('codes-container');
            container.innerHTML = 'Загрузка...';

            try {
                // Запрашиваем данные из таблицы 'codes' в Supabase
                const { data, error } = await supabaseClient
                    .from('codes')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) throw error;

                if (!data || data.length === 0) {
                    container.innerHTML = '<p>Пока нет добавленных кодов.</p>';
                    return;
                }

                container.innerHTML = '';
                data.forEach(item => {
                    const div = document.createElement('div');
                    div.className = 'code-item';
                    div.innerHTML = `<span>${item.code_text}</span> <small>${new Date(item.created_at).toLocaleString()}</small>`;
                    container.appendChild(div);
                });

            } catch (err) {
                console.error('Ошибка загрузки:', err);
                container.innerHTML = '<p style="color: red;">Ошибка подключения к базе данных.</p>';
            }
        }

        function checkAdmin() {
            const pass = document.getElementById('admin-pass').value;
            if (pass === ADMIN_PASSWORD) {
                document.getElementById('admin-controls').style.display = 'block';
                alert('Доступ разрешен!');
            } else {
                alert('Неверный пароль!');
            }
        }

        async function addCodeToDatabase() {
            const codeInput = document.getElementById('new-code');
            const codeText = codeInput.value.trim();

            if (!codeText) {
                alert('Введите текст кода!');
                return;
            }

            try {
                // Сохраняем код напрямую в таблицу 'codes' в Supabase
                const { error } = await supabaseClient
                    .from('codes')
                    .insert([{ code_text: codeText }]);

                if (error) throw error;

                alert('Код успешно сохранен в базу данных и теперь доступен всем!');
                codeInput.value = '';
                
                // Перезагружаем список, чтобы увидеть изменения
                loadCodesFromDatabase();

            } catch (err) {
                console.error('Ошибка сохранения:', err);
                alert('Не удалось сохранить код в базу данных.');
            }
        }
    </script>
</body>
</html>
